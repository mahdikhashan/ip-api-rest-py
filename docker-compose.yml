version: "3.8"

services:
  reverse-proxy:
    image: nginx
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"

  web:
    image: ipapirestregistry123.azurecr.io/ip-api-rest-py:${IMAGE_TAG}
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=development
